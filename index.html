<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pikachu Forest Dream</title><style>
html,body{margin:0;height:100%;overflow:hidden;background:#07150e;font-family:system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;image-rendering:auto}.ui{position:fixed;inset:0;pointer-events:none}.card,.badge,.hint{position:absolute;background:#06130dcc;border:1px solid #ffffff20;backdrop-filter:blur(8px);color:#fff}.card{left:16px;top:16px;padding:11px 14px;border-radius:15px}.title{font-weight:800}.sub{font-size:12px;color:#cfe8ca;margin-top:3px}.badge{right:16px;top:16px;padding:8px 11px;border-radius:999px;font-size:11px}.hint{left:50%;bottom:15px;transform:translateX(-50%);padding:8px 13px;border-radius:999px;font-size:12px;color:#e5f5e1}
</style></head><body><canvas id="game"></canvas><div class="ui"><div class="card"><div class="title">Pikachu · Forest Dream</div><div class="sub" id="place">Sunny Trail</div></div><div class="badge" id="weather">Morning · Clear</div><div class="hint">WASD / arrows · Shift to trot · E to rest</div></div>
<script>
const c=document.getElementById('game'),g=c.getContext('2d'),img=new Image();img.src='assets/pokemon-forest-sprites.webp';
let dpr=Math.min(2,devicePixelRatio||1),t=0;function size(){c.width=innerWidth*dpr;c.height=innerHeight*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
const K=new Set;addEventListener('keydown',e=>{K.add(e.key.toLowerCase());if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>K.delete(e.key.toLowerCase()));
const S=56,W=116,H=78,WW=W*S,WH=H*S,P={x:15*S,y:57*S,face:2,walk:0},C={x:0,y:0};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const n=(x,y)=>{let v=Math.sin(x*127.1+y*311.7)*43758.5453;return v-Math.floor(v)};
/* The supplied 1536x1024 sheet was reduced to 384x256 for the web build. All environment and Pikachu art below is sampled from that sheet. */
const A={grass:[2,7,18,19],sand:[43,7,18,19],stone:[61,7,18,19],wood:[80,7,18,19],water:[103,7,18,19],stream:[147,7,18,19],tall:[2,33,18,19],flowers:[43,33,18,19],leaves:[61,33,18,19],moss:[80,33,18,19],rock:[207,94,18,18],bush:[103,94,18,19],plant:[123,94,18,19],fern:[145,94,18,19],tree:[3,94,18,19],pine:[42,94,18,19],fallen:[61,94,18,19],bridge:[289,7,18,19],waterfall:[145,33,18,19],cave:[287,94,18,19],flowerField:[175,206,18,19]};
function atlas(name,x,y,w=S,h=S){let a=A[name];if(!a)return;g.drawImage(img,a[0],a[1],a[2],a[3],x,y,w,h)}
function tile(x,y,name){atlas(name,x*S,y*S,S+1,S+1)}
function region(){let x=P.x/S,y=P.y/S;if(x>62&&x<79&&y>22&&y<41)return'Waterfall View';if(x>42&&x<61&&y>35&&y<57)return'Mossy Creek';if(x>84&&y>45)return'Hidden Meadow';if(x>72&&x<91&&y>55)return'Forest Ruins';if(x>25&&x<44&&y>48)return'Flower Field';if(x>77&&y<42)return'Old Forest';return'Sunny Trail'}
function world(){
 g.save();g.translate(-C.x,-C.y);let sx=Math.floor(C.x/S)-1,ex=Math.ceil((C.x+innerWidth)/S)+1,sy=Math.floor(C.y/S)-1,ey=Math.ceil((C.y+innerHeight)/S)+1;
 for(let y=sy;y<=ey;y++)for(let x=sx;x<=ex;x++){let z='grass';if(y>=55&&y<=60)z=(n(x,y)>.65?'sand':'grass');if(x>=49&&x<=52&&y>=23&&y<=55)z='water';if(x>=65&&x<=76&&y>=27&&y<=37)z='water';tile(x,y,z)}
 // asset-based paths
 for(let x=-2;x<W;x+=1){tile(x,56,'sand');tile(x,57,'sand');tile(x,58,'sand')}
 for(let y=28;y<56;y++)tile(51,y,y%3?'water':'stream');
 // bridges from the supplied sheet
 for(let x=47;x<55;x++)tile(x,38,'bridge');for(let x=68;x<76;x++)tile(x,33,'bridge');
 // dense asset vegetation
 for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2){let q=n(x,y);if(q>.63){let type=q>.9?'pine':q>.82?'bush':q>.74?'fern':'tree';if((x>45&&x<58&&y>34&&y<58)||(x>63&&x<79&&y>20&&y<41))continue;atlas(type,x*S-9,y*S-12,72,76)}}
 // flowers / tall grass / rocks
 for(let i=0;i<180;i++){let x=(i*37%113),y=(i*61%74);if(n(i,9)>.56)atlas(n(i,9)>.78?'flowers':'tall',x*S,y*S,44,46)}
 for(let i=0;i<65;i++){let x=(i*71%112),y=(i*43%74);if(n(i,2)>.45)atlas('rock',x*S,y*S+10,40,40)}
 // scenic waterfall and cave
 for(let y=20;y<28;y++)atlas('waterfall',69*S,y*S,54,58);
 atlas('cave',91*S,18*S,70,70);atlas('flowerField',31*S,50*S,75,75);
 g.restore()
}
function pika(){
 g.save();g.translate(P.x-C.x,P.y-C.y);let bob=P.walk?Math.sin(P.walk*12)*2:Math.sin(t*2)*1.2;g.translate(0,bob);
 // Pikachu idle frames are the bottom-left Pikachu frames on the supplied sheet.
 // Source frame strip is around x=4..58, y=224..245 in the reduced atlas.
 let frame=P.walk?Math.floor(P.walk*1.8)%4:Math.floor(t*1.5)%4, sx=4+frame*14, sy=225;
 g.imageSmoothingEnabled=false;g.drawImage(img,sx,sy,13,19,-27,-38,54,78);g.restore()
}
function atmosphere(){
 let phase=(t/50)%1,mode=phase<.22?'Morning':phase<.48?'Afternoon':phase<.64?'Sunset':phase<.82?'Night':'Dawn';let rain=Math.floor(t/40)%4===3;
 if(mode==='Night'){g.fillStyle='#0b194f66';g.fillRect(0,0,innerWidth,innerHeight);for(let i=0;i<35;i++){g.fillStyle='#fff8';g.fillRect((i*97+t*3)%innerWidth,(i*53)%innerHeight,2,2)}}else if(mode==='Sunset'){g.fillStyle='#d87b3b22';g.fillRect(0,0,innerWidth,innerHeight)}
 for(let i=0;i<18;i++){let x=(i*139+t*20)%innerWidth,y=(i*71+Math.sin(t+i)*12)%innerHeight;g.strokeStyle='#e8f8df44';g.beginPath();g.moveTo(x,y);g.lineTo(x+12,y-3);g.stroke()}
 if(rain){g.strokeStyle='#a7d8ef55';for(let i=0;i<110;i++){let x=(i*83+t*180)%innerWidth,y=(i*47+t*280)%innerHeight;g.beginPath();g.moveTo(x,y);g.lineTo(x-5,y+13);g.stroke()}}
 document.getElementById('weather').textContent=mode+' · '+(rain?'Rain':'Clear');document.getElementById('place').textContent=region()
}
function loop(ms){let dt=Math.min(.035,(ms-(loop.last||ms))/1000);loop.last=ms;t+=dt;let dx=(K.has('d')||K.has('arrowright')?1:0)-(K.has('a')||K.has('arrowleft')?1:0),dy=(K.has('s')||K.has('arrowdown')?1:0)-(K.has('w')||K.has('arrowup')?1:0),l=Math.hypot(dx,dy)||1,sp=K.has('shift')?210:150;if(dx||dy){dx/=l;dy/=l;P.walk+=dt*sp/22;if(Math.abs(dx)>Math.abs(dy))P.face=dx>0?3:1;else P.face=dy>0?2:0}else P.walk=0;
 P.x=clamp(P.x+dx*sp*dt,30,WW-30);P.y=clamp(P.y+dy*sp*dt,30,WH-30);C.x+=(clamp(P.x-innerWidth/2,0,WW-innerWidth)-C.x)*.12;C.y+=(clamp(P.y-innerHeight/2,0,WH-innerHeight)-C.y)*.12;
 g.clearRect(0,0,innerWidth,innerHeight);world();pika();atmosphere();requestAnimationFrame(loop)}img.onload=()=>requestAnimationFrame(loop);
</script></body></html>
